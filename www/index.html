/* ===================== Cosa cucino con quello che ho ===================== */
const STAPLES=["sale","pepe","olio","acqua","zucchero"];
function isStaple(nn){ return STAPLES.some(s=> nn===s || nn.startsWith(s+" ") || nn.endsWith(" "+s)); }
function stemWord(w){ return (w.length>4 && /[aeiou]$/.test(w)) ? w.slice(0,-1) : w; }
/* true se il termine "ho" copre l'ingrediente (tollerante a plurali e forme) */
function termMatches(h, ingName){
  const nn=normName(ingName);
  if(!h||!nn) return false;
  if(nn===h) return true;
  const hwords=h.split(/[\s,]+/).filter(w=>w.length>=3);
  const nwords=nn.split(/[\s,]+/).filter(w=>w.length>=3);
  if(hwords.length>1 && nn.includes(h)) return true;   // frase multi-parola
  const hs=hwords.map(stemWord), ns=nwords.map(stemWord);
  for(const a of hs){ for(const b of ns){ if(a===b) return true; } } // match per parola (gestisce i plurali)
  return false;
}
/* ingredienti mancanti di una ricetta rispetto alla dispensa */
function recipeMissing(r, haveNorm, ignoreStaples){
  const miss=[];
  for(const ing of (r.ingredienti||[])){
    const name=ing.n; if(!name) continue;
    const nn=normName(name);
    if(ignoreStaples && isStaple(nn)) continue;
    let covered=false;
    for(const h of haveNorm){ if(termMatches(h, name)){ covered=true; break; } }
    if(!covered) miss.push(name);
  }
  return miss;
}
/* quanti ingredienti (non base) sono coperti e quali mancano */
function recipeCoverage(r, haveNorm, ignoreStaples){
  let covered=0; const missing=[];
  for(const ing of (r.ingredienti||[])){
    const name=ing.n; if(!name) continue;
    const nn=normName(name);
    if(ignoreStaples && isStaple(nn)) continue;
    let ok=false;
    for(const h of haveNorm){ if(termMatches(h, name)){ ok=true; break; } }
    if(ok) covered++; else missing.push(name);
  }
  return {covered, missing};
}
async function addPantry(term){
  const t=(term||"").trim(); if(!t) return;
  const nn=normName(t);
  if(App.pantry.some(x=>normName(x)===nn)){ toast("Già in dispensa"); return; }
  App.pantry.push(t); await App.savePantry(); renderCucino();
}
async function removePantry(term){
  App.pantry=App.pantry.filter(x=>x!==term); await App.savePantry(); renderCucino();
}
async function clearPantry(){ App.pantry=[]; await App.savePantry(); renderCucino(); }
async function toggleStaples(){ App.pantryStaples=!App.pantryStaples; await App.savePantry(); renderCucino(); }
async function addMissingToSpesa(rid){
  const r=App.find(rid); if(!r) return;
  const haveNorm=App.pantry.map(normName).filter(Boolean);
  const ignore=App.pantryStaples!==false;
  const missSet=new Set(recipeMissing(r, haveNorm, ignore).map(normName));
  if(!missSet.size){ toast("Niente da aggiungere"); return; }
  let added=0;
  (r.ingredienti||[]).forEach(i=>{
    if(!missSet.has(normName(i.n))) return;
    const q = (i.q==null||i.q==="") ? null : (parseFloat(i.q)||0);   // dose base della ricetta
    const key = normName(i.n)+"|"+normName(i.u||"");
    const ex = App.spesa.find(s=>s.key===key);
    if(ex){ if(ex.q!=null && q!=null) ex.q=Math.round((ex.q+q)*100)/100; if(!ex.from.includes(r.nome)) ex.from.push(r.nome); ex.checked=false; }
    else { App.spesa.push({key, n:i.n, u:i.u||"", q, checked:false, from:[r.nome]}); }
    added++;
  });
  await App.saveSpesa();
  toast(added+" "+plural(added,'ingrediente aggiunto','ingredienti aggiunti')+" alla spesa");
}
function addPantryFromInput(){
  const el=document.getElementById("pantryInput"); if(!el) return;
  const v=el.value.trim(); if(!v) return;
  el.value=""; addPantry(v);
}
function renderCucino(){
  const app=document.getElementById("app");
  const have=App.pantry.slice();
  const haveNorm=have.map(normName).filter(Boolean);
  const ignore=App.pantryStaples!==false;

  const known={}; App.recipes.forEach(r=>(r.ingredienti||[]).forEach(i=>{ const k=normName(i.n); if(k&&!known[k]) known[k]=i.n; }));
  const suggest=Object.values(known).sort((a,b)=>a.localeCompare(b,'it'));

  const scored=App.recipes.map(r=>{ const c=recipeCoverage(r, haveNorm, ignore); return { r, missing:c.missing, covered:c.covered }; });
  const makeable = have.length? scored.filter(x=>(x.r.ingredienti||[]).length>0 && x.covered>0 && x.missing.length===0)
    .sort((a,b)=>a.r.nome.localeCompare(b.r.nome,'it')) : [];
  const partialAll = have.length? scored.filter(x=>x.covered>0 && x.missing.length>0)
    .sort((a,b)=> a.missing.length-b.missing.length || b.covered-a.covered || a.r.nome.localeCompare(b.r.nome,'it')) : [];
  const partial = partialAll.slice(0,50);

  const chips = have.length
    ? have.map(t=>`<span class="pantry-chip">${esc(t)}<button onclick="removePantry('${jesc(t)}')" aria-label="Togli">${I.close}</button></span>`).join("")
    : `<span class="hint">Aggiungi gli ingredienti che hai in casa per vedere cosa puoi cucinare.</span>`;

  const card = x => {
    const open = `<button class="cr-open" onclick="App.open('${x.r.id}')">
        <span class="cr-name">${esc(x.r.nome)}</span>
        <span class="cr-sub">${esc(x.r.categoria||'')}${x.r.categoria?' · ':''}${x.r.tipo==='bimby'?'Bimby':'Classica'} · hai ${x.covered}${x.missing.length?` · manca ${x.missing.length}`:''}</span>
        ${x.missing.length?`<span class="cr-miss">Manca: ${x.missing.slice(0,4).map(m=>esc(m)).join(", ")}${x.missing.length>4?` +${x.missing.length-4}`:""}</span>`:''}
      </button>`;
    const side = x.missing.length
      ? `<span class="cr-badge miss">−${x.missing.length}</span>
         <button class="btn sm add-miss no-print" onclick="addMissingToSpesa('${x.r.id}')" title="Aggiungi i mancanti alla lista della spesa">+ Spesa</button>`
      : `<span class="cr-badge ok">✓</span>`;
    return `<div class="cucino-row">${open}<div class="cr-side">${side}</div></div>`;
  };

  app.innerHTML=`
    <button class="back no-print" onclick="App.go('browse')">${I.back} Torna al ricettario</button>
    <h1 style="font-size:30px;margin-bottom:4px">Cosa cucino?</h1>
    <p class="lead" style="margin-top:0">Dimmi cosa hai in casa: ti mostro cosa puoi fare ora e cosa ti manca poco.</p>

    <div class="pantry-box">
      <div class="pantry-inrow">
        <input id="pantryInput" list="ingList" placeholder="Aggiungi un ingrediente…" autocomplete="off"
          onkeydown="if(event.key==='Enter'){event.preventDefault();addPantryFromInput();}">
        <datalist id="ingList">${suggest.map(s=>`<option value="${esc(s)}"></option>`).join("")}</datalist>
        <button class="btn" onclick="addPantryFromInput()">+ Aggiungi</button>
      </div>
      <div class="pantry-chips">${chips}</div>
      <div class="pantry-tools">
        <label class="pantry-toggle"><input type="checkbox" ${ignore?'checked':''} onchange="toggleStaples()"> Ignora dispensa base <span class="hint">(sale, olio, acqua…)</span></label>
        ${have.length?`<button class="btn sm ghost" onclick="clearPantry()">Svuota</button>`:''}
      </div>
    </div>

    ${!have.length? '' : `
      <div class="cucino-sec">
        <h2>Puoi fare ora <span class="hint">(${makeable.length})</span></h2>
        ${makeable.length? `<div class="cucino-list">${makeable.map(card).join("")}</div>`
          : `<p class="hint">Nessuna ricetta completa con questi ingredienti. Guarda qui sotto quelle che li usano.</p>`}
      </div>
      <div class="cucino-sec">
        <h2>Con i tuoi ingredienti <span class="hint">(${partialAll.length})</span></h2>
        ${partial.length? `<div class="cucino-list">${partial.map(card).join("")}</div>${partialAll.length>partial.length?`<p class="hint" style="margin-top:8px">…e altre ${partialAll.length-partial.length}. Aggiungi più ingredienti per restringere.</p>`:''}`
          : `<p class="hint">Nessuna ricetta usa questi ingredienti. Prova ad aggiungerne altri.</p>`}
      </div>
    `}
  `;
}

/* ===================== Selettore ricetta con ricerca (resta aperto) ===================== */
function openRecipePicker(opts){
  if(!App.recipes.length){ toast("Nessuna ricetta disponibile"); return; }
  const old=document.getElementById("recPicker"); if(old) old.remove();
  const wrap=document.createElement("div"); wrap.id="recPicker"; wrap.className="modal-overlay";
  wrap.innerHTML=`
    <div class="modal picker">
      <div class="picker-head">
        <h2>${esc(opts.title||"Scegli ricetta")}</h2>
        <button class="drawer-x" id="pkClose" aria-label="Chiudi">✕</button>
      </div>
      <div class="search picker-search">${I.search}<input id="pkSearch" type="search" placeholder="Cerca ricetta…" autocomplete="off"></div>
      <div class="picker-list" id="pkList"></div>
      <div class="picker-foot">${opts.footerHTML||'<span class="hint">Tocca per aggiungere · il menu resta aperto</span>'}<button class="btn primary" id="pkDone">Fatto</button></div>
    </div>`;
  document.body.appendChild(wrap);
  const input=wrap.querySelector("#pkSearch"), listEl=wrap.querySelector("#pkList");
  function draw(){
    const q=input.value.trim();
    let list=App.recipes.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'it'));
    if(q) list=smartSearch(q, list);
    if(!list.length){ listEl.innerHTML='<div class="hint" style="padding:16px">Nessuna ricetta trovata.</div>'; return; }
    listEl.innerHTML=list.map(r=>{
      const on=opts.rowOn?opts.rowOn(r.id):false;
      return `<button class="pk-row ${on?'on':''}" data-id="${r.id}">
        <span class="pk-main"><span class="pk-name">${esc(r.nome)}</span>
        <span class="pk-sub">${esc(r.categoria||'')}${r.categoria?' · ':''}${r.tipo==='bimby'?'Bimby':'Classica'}</span></span>
        <span class="pk-check">${on?'✓':'+'}</span></button>`;
    }).join("");
  }
  listEl.onclick=(e)=>{ const b=e.target.closest(".pk-row"); if(!b) return; Promise.resolve(opts.onPick(b.getAttribute("data-id"))).then(draw); };
  input.oninput=draw;
  const close=()=>{ wrap.remove(); if(opts.onClose) opts.onClose(); };
  wrap.querySelector("#pkClose").onclick=close;
  wrap.querySelector("#pkDone").onclick=close;
  wrap.onclick=(e)=>{ if(e.target===wrap) close(); };
  draw();
  setTimeout(()=>{ try{ input.focus(); }catch(e){} }, 60);
}
/* Piano: aggiunge/toglie ricette da uno slot (multi, resta aperto) */
function pickForSlot(g,p){
  const gLabel=(GIORNI.find(x=>x[0]===g)||[])[1]||"";
  const pLabel=(PASTI.find(x=>x[0]===p)||[])[1]||"";
  openRecipePicker({
    title:pLabel+" · "+gLabel,
    rowOn: rid => App.plan[g][p].includes(rid),
    onPick: rid => {
      if(App.plan[g][p].includes(rid)) App.plan[g][p]=App.plan[g][p].filter(x=>x!==rid);
      else App.plan[g][p].push(rid);
      App.savePlan();
    },
    onClose: ()=>{ if(App.view==="piano") renderPiano(); }
  });
}
/* Spesa: aggiunge gli ingredienti di una ricetta alle porzioni scelte (resta aperto) */
function pickForSpesa(){
  openRecipePicker({
    title:"Aggiungi da una ricetta",
    footerHTML:'<label class="pk-port">Porzioni <input id="pkPort" type="number" min="1" max="50" value="4"></label>',
    onPick: async rid => {
      const p=Math.max(1,parseInt((document.getElementById("pkPort")||{}).value)||4);
      await addToSpesa(rid, p);
      const r=App.find(rid);
      toast("Aggiunta: "+(r?r.nome:"ricetta")+" ("+p+" porz.)");
    },
    onClose: ()=>{ if(App.view==="spesa") renderSpesa(); }
  });
}

async function buildExportPayload(){

    .map(r=>{ const c=JSON.parse(JSON.stringify(r)); delete c.preferito; delete c.rating; delete c.aperture; // personali
              if(!withPhotos) c.foto=[]; return c; });
  if(!chosen.length) return null;
  const payload={ app:"Ricettario", versione:1, esportato:new Date().toISOString(), ricette:chosen };

function onImportFile(input){
  const file=input.files[0]; if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const raw=JSON.parse(fr.result);
      const arr = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.ricette) ? raw.ricette : null);
      if(!arr) throw 0;
      const fotos = (raw && raw.fotos && typeof raw.fotos==="object") ? raw.fotos : {};
      App.importFotos = fotos;
      const haveId=new Set(App.recipes.map(r=>r.id));
      const haveName=new Set(App.recipes.map(r=>normName(r.nome)));
      const seenIncoming=new Set();
      App.importStaging = arr.filter(r=>r&&r.nome).map(r=>{
        // normalizza struttura minima
        if(!Array.isArray(r.ingredienti)) r.ingredienti=[];
        if(!Array.isArray(r.passaggi)) r.passaggi=[];
        if(!Array.isArray(r.tags)) r.tags=[];
        if(typeof r.note!=="string") r.note="";
        r.preferito=false; r.rating=0; r.aperture=0; // preferito, voto e aperture sono personali
        // foto: tengo solo i riferimenti che hanno davvero i dati nel file
        r.foto = Array.isArray(r.foto) ? r.foto.filter(fid=>fotos[fid]) : [];
        if(!r.id || seenIncoming.has(r.id)) r.id=id(); // garantisce ID univoco
        seenIncoming.add(r.id);
        let status;
        if(haveId.has(r.id)) status='present';            // stesso ID -> doppione certo
        else if(haveName.has(normName(r.nome))) status='name'; // nome uguale, ID diverso
        else status='new';
        return { recipe:r, status, checked: status==='new' }; // di default solo le nuove
      });
      App.shareTab='import'; renderShare();
    }catch(e){ toast("File non valido o vuoto"); }
  };
  fr.readAsText(file);
  input.value="";
}
function importToggle(i){ const s=App.importStaging[i]; if(s.status==='present') return; s.checked=!s.checked; renderImportTab(); }
function importSelect(mode){
  App.importStaging.forEach(s=>{
    if(s.status==='present'){ s.checked=false; return; }
    if(mode==='new') s.checked = s.status==='new';
    else if(mode==='all') s.checked = true;
    else s.checked=false;
  });
  renderImportTab();
}
async function doImport(){
  const haveId=new Set(App.recipes.map(r=>r.id));
  const fotos=App.importFotos||{};
  const idbHave=new Set();
  let added=0, skipped=0;
  const toStore=[];
  for(const s of App.importStaging){
    if(!s.checked || s.status==='present' || haveId.has(s.recipe.id)){ skipped++; continue; }
    App.recipes.unshift(s.recipe); haveId.add(s.recipe.id); added++;
    for(const fid of (s.recipe.foto||[])){ if(fotos[fid]) toStore.push(fid); }
  }
  await App.save();
  // salvo le foto in IndexedDB (solo quelle non già presenti)
  if(hasIDB){
    for(const fid of toStore){
      if(idbHave.has(fid)) continue; idbHave.add(fid);
      const existing=await IDB.get(fid);
      if(existing) continue;
      const blob=dataURLToBlob(fotos[fid]);
      if(blob){ try{ await IDB.put({id:fid, blob, tipo:blob.type, ts:Date.now()}); }catch(e){} }
    }
  }
  App.importStaging=[]; App.importFotos=null;
  toast(added+" "+plural(added,'ricetta importata','ricette importate')+(skipped?(" · "+skipped+" saltate"):""));
  App.go("browse");
}

const BACKUP_FILENAME = "ricettario-backup.json";
function fmtDateTime(ts){
  try{ return new Date(ts).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return ""; }
}
function markBackupDone(){ App.settings.lastBackup=Date.now(); App.saveSettings(); } // solo quando il backup esiste davvero

function downloadJSON(obj, filename){
  const text=JSON.stringify(obj,null,2);
  const isApp = !!(window.cordova && window.resolveLocalFileSystemURL && window.cordova.file);
  return isApp ? cordovaBackup(text, filename)   // scrive persistente + condivide
               : exportFallback(text, filename);  // browser/PWA: copia / scarica / condividi
}

/* scrive testo in una cartella Cordova e restituisce il VERO percorso file:// (nativeURL),
   necessario ai plugin nativi: sotto lo schema https, toURL() darebbe un URL non allegabile. */
function writeFileTo(dir, name, text, ok, err){
  window.resolveLocalFileSystemURL(dir, function(dirEntry){
    dirEntry.getFile(name, {create:true, exclusive:false}, function(fileEntry){
      fileEntry.createWriter(function(w){
        w.onwriteend=function(){ ok(fileEntry.nativeURL || fileEntry.toURL()); };
        w.onerror=err;
        w.write(new Blob([text],{type:"application/json"}));
      }, err);
    }, err);
  }, err);
}
/* App Android: scrive il backup PERSISTENTE in externalDataDirectory (resta anche se annulli),
   poi apre il pannello affidabile (Copia + Condividi/Salva). Niente auto-condivisione col plugin,
   che su molti dispositivi non allega il file. markBackupDone() scatta alla scrittura riuscita. */
function cordovaBackup(text, shareName){
  return new Promise(function(resolve, reject){
    try{
      const persistDir = cordova.file.externalDataDirectory || cordova.file.dataDirectory;
      if(!persistDir){ return resolve(exportFallback(text, shareName)); }
      const onWritten=function(){
        markBackupDone();
        if(App.view==="share"){ try{ renderShare(); }catch(_){} }
        toast("Backup salvato nell'app ✓");
        resolve(exportFallback(text, shareName));   // pannello: Copia / Condividi-Salva
      };
      const onFail=function(e){ warn("scrittura backup", e); resolve(exportFallback(text, shareName)); };
      writeFileTo(persistDir, BACKUP_FILENAME, text, onWritten, onFail);
    }catch(e){ reject(e); }
  });
}
/* condivisione col plugin (ultima spiaggia): copia in cache e apre il menu Android */
function shareText(text, shareName){
  if(!(window.plugins && window.plugins.socialsharing)){ toast("Condivisione non disponibile: usa Copia"); return; }
  const dir = cordova.file.cacheDirectory || cordova.file.externalCacheDirectory;
  if(!dir){ toast("Condivisione non disponibile: usa Copia"); return; }
  writeFileTo(dir, shareName||BACKUP_FILENAME, text,
    function(url){ shareFile(url); },
    function(e){ warn("copia condivisione", e); toast("Condivisione non riuscita: usa Copia negli appunti"); });
}
function shareFile(url){
  if(window.plugins && window.plugins.socialsharing){
    window.plugins.socialsharing.shareWithOptions({subject:"Backup Ricettario", files:[url]}, function(){}, function(){});
  }
}
/* ricondivide l'ultimo backup persistente: lo rilegge e riapre il pannello Copia/Condividi */
function shareLastBackup(){
  const base = window.cordova && cordova.file && (cordova.file.externalDataDirectory||cordova.file.dataDirectory);
  if(!base){ toast("Non disponibile qui"); return; }
  window.resolveLocalFileSystemURL(base + BACKUP_FILENAME, function(fe){
    fe.file(function(file){
      const r=new FileReader();
      r.onloadend=function(){ exportFallback(String(r.result||""), BACKUP_FILENAME); };
      r.onerror=function(){ toast("Backup non leggibile"); };
      r.readAsText(file);
    }, function(){ toast("Backup non leggibile"); });
  }, function(){ toast("Nessun backup salvato: premi Esporta"); });
}

function exportFallback(text, filename){
  return new Promise(function(resolve){
    const old=document.getElementById("exportModal"); if(old) old.remove();
    const isApp = !!(window.cordova);
    let canWebShare=false;
    try{ const f=new File([text],filename,{type:"application/json"}); canWebShare=!!(navigator.canShare && navigator.canShare({files:[f]})); }catch(e){}
    const canPlugin = !!(window.plugins && window.plugins.socialsharing);
    const showShare = canWebShare || canPlugin;
    const wrap=document.createElement("div");
    wrap.id="exportModal"; wrap.className="modal-overlay";
    wrap.innerHTML=`
      <div class="modal">
        <h2>Backup delle ricette</h2>
        <p class="hint"><b>Copia negli appunti</b> è il metodo garantito: incolla in una mail a te stesso, in Note o su Drive. In alternativa Condividi/Salva.</p>
        <textarea id="exportText" readonly spellcheck="false"></textarea>
        <div class="modal-actions">
          <button class="btn primary" id="btnCopy">Copia negli appunti</button>
          ${showShare?`<button class="btn" id="btnShare">Condividi / Salva</button>`:``}
          ${isApp?``:`<button class="btn" id="btnDl">Scarica file</button>`}
          <button class="btn ghost" id="btnClose">Chiudi</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const ta=wrap.querySelector("#exportText"); ta.value=text;
    const close=()=>{ wrap.remove(); resolve(true); };
    wrap.querySelector("#btnClose").onclick=close;
    wrap.onclick=(e)=>{ if(e.target===wrap) close(); };
    wrap.querySelector("#btnCopy").onclick=async ()=>{
      let ok=false;
      try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); ok=true; } }catch(e){}
      if(!ok){ try{ ta.focus(); ta.select(); ta.setSelectionRange(0,text.length); ok=document.execCommand("copy"); }catch(e){} }
      if(ok){ markBackupDone(); if(App.view==="share"){ try{ renderShare(); }catch(_){} } }
      toast(ok?"Copiato ✓ — incollalo in un posto sicuro":"Seleziona il testo e copialo a mano");
    };
    const dl=wrap.querySelector("#btnDl");
    if(dl){ dl.onclick=()=>{
      try{
        const blob=new Blob([text],{type:"application/json"}); const url=URL.createObjectURL(blob);
        const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url); markBackupDone(); if(App.view==="share"){ try{ renderShare(); }catch(_){} }
        toast("Scaricato");
      }catch(e){ toast("Download non disponibile: usa Copia"); }
    }; }
    const sb=wrap.querySelector("#btnShare");
    if(sb){
      sb.onclick=async ()=>{
        const f=(function(){ try{ return new File([text],filename,{type:"application/json"}); }catch(e){ return null; } })();
        // 1) Web Share nativa con file, se davvero supportata (attivata da QUESTO tocco).
        if(f && navigator.canShare && navigator.canShare({files:[f]}) && navigator.share){
          try{
            await navigator.share({files:[f], title:"Ricette dal Ricettario"});
            markBackupDone(); if(App.view==="share"){ try{ renderShare(); }catch(_){} }
          }catch(e){ /* annullato o rifiutato: non riprovo, per non aprire due menu */ }
          return;
        }
        // 2) altrimenti plugin nativo, con il VERO percorso file:// (nativeURL)
        if(window.plugins && window.plugins.socialsharing){ shareText(text, filename); }
        else toast("Condivisione non disponibile: usa Copia negli appunti");
      };
    }
  });
}

<script>
(function(){
  var web = location.protocol==='https:' || location.protocol==='http:';
  if(!web) return;
  var m=document.createElement('link'); m.rel='manifest'; m.href='manifest.json'; document.head.appendChild(m);
  var t=document.createElement('meta'); t.name='theme-color'; t.content='#A8362A'; document.head.appendChild(t);
  var a=document.createElement('link'); a.rel='apple-touch-icon'; a.href='icon-192.png'; document.head.appendChild(a);
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
