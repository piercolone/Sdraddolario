<!-- Ricettario — portale ricette classiche e Bimby
     Singolo file HTML/CSS/JS. I dati restano salvati sul dispositivo tramite localStorage. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricettario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FAF6EF;        /* semola / carta calda */
    --surface:#FFFFFF;
    --ink:#2B2622;          /* espresso */
    --muted:#8A8178;
    --line:#EAE1D4;         /* filetto caldo */
    --line-strong:#DBCFBD;
    --primary:#A8362A;      /* rosso sugo */
    --primary-soft:#F6E6E2;
    --bimby:#15756A;        /* verde acqua "display" */
    --bimby-soft:#E2F0ED;
    --gold:#C8881A;         /* zafferano */
    --radius:14px;
    --shadow:0 1px 0 var(--line), 0 8px 24px -16px rgba(43,38,34,.35);
    --maxw:1100px;
  }
  body.theme-dark{
    --paper:#181511;        /* fondo scuro caldo */
    --surface:#221E19;
    --ink:#F1EADD;          /* testo chiaro */
    --muted:#A79D8C;
    --line:#332E27;
    --line-strong:#463F36;
    --primary:#E06A54;      /* rosso più luminoso su scuro */
    --primary-soft:#3A241F;
    --bimby:#3FB0A0;
    --bimby-soft:#12332F;
    --gold:#E0A93E;
    --shadow:0 1px 0 var(--line), 0 8px 24px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  body.theme-dark .brand .mark{color:#fff}
  body.theme-dark img,body.theme-dark .thumb.photo{filter:none}
  body.theme-dark header.bar{background:rgba(24,21,17,.88)}
  body.theme-dark .card .thumb{background:linear-gradient(135deg,#2b2521,#221d18)}
  body.theme-dark .card.bimby .thumb{background:linear-gradient(135deg,#123230,#0f2a27)}
  body.theme-dark .dg-main,body.theme-dark .dg-thumb,body.theme-dark .foto-item{background-color:#2b2521}
  /* rifiniture tema scuro: niente lampi chiari, contrasti coerenti */
  body.theme-dark .card{background:radial-gradient(120% 120% at 80% 0%, rgba(255,255,255,.04), transparent 60%), linear-gradient(135deg,#241f1a,#1d1915)}
  body.theme-dark .card .thumb.photo{background:#2b2521 center/cover no-repeat}
  body.theme-dark .fav-btn{background:rgba(255,255,255,.12)}
  body.theme-dark .btn:hover{background:#2c2621}
  body.theme-dark .btn.primary:hover{background:#c85942}
  body.theme-dark .share-row:hover{background:#2c2621}
  body.theme-dark .badge{background:rgba(255,255,255,.10);color:var(--ink)}
  body.theme-dark .btn.iconlabel.fav-on{color:var(--gold);border-color:#4a3d1c;background:#2c2413}
  body.theme-dark .sbadge.name{background:#3a2f14;color:#e7c877}
  body.theme-dark .sbadge.dup{background:#2f2a22;color:var(--muted)}
  body.theme-dark .iconbtn:hover{border-color:var(--primary);background:var(--primary-soft)}
  body.theme-dark .btn.danger{border-color:#5a2f2a}
  body.theme-dark .plan-chip{background:var(--primary-soft)}
  body.theme-dark .modal-overlay{background:rgba(0,0,0,.6)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
    overflow-x:hidden;   /* evita che un elemento largo faccia sbordare l'intera pagina */
  }
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.12;margin:0}
  button{font-family:inherit;cursor:pointer}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
  a{color:inherit}
  ::selection{background:var(--primary-soft)}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

  /* ---------- top bar ---------- */
  header.bar{
    position:sticky;top:0;z-index:30;
    background:rgba(250,246,239,.86);
    backdrop-filter:saturate(1.1) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar-in{
    max-width:var(--maxw);margin:0 auto;
    display:flex;align-items:center;gap:16px;
    padding:12px 18px;
  }
  .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .brand .mark{
    width:34px;height:34px;border-radius:9px;flex:0 0 auto;
    background:var(--primary);color:#fff;display:grid;place-items:center;
    font-family:Fraunces;font-weight:700;font-size:20px;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);
  }
  .brand b{font-family:Fraunces;font-weight:600;font-size:21px;letter-spacing:.2px}
  .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-family:"Space Mono",monospace}
  .bar-spacer{flex:1 1 auto}
  .nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;max-width:100%}
  .nav button{
    border:0;background:transparent;color:var(--muted);
    padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;
    white-space:nowrap;
  }
  .nav button.active{background:var(--ink);color:var(--paper)}
  /* hamburger */
  .nav-more{display:inline-flex;flex-direction:column;justify-content:center;gap:4px;width:40px;height:36px;
    border:0;background:transparent;border-radius:8px;cursor:pointer;padding:0 10px}
  .nav-more span{display:block;height:2px;border-radius:2px;background:var(--ink);transition:.15s}
  .nav-more:hover span{background:var(--primary)}
  /* drawer laterale */
  .drawer-overlay{position:fixed;inset:0;z-index:110;background:rgba(20,16,12,.5);opacity:0;pointer-events:none;transition:opacity .22s}
  .drawer-overlay.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;left:0;bottom:0;z-index:111;width:260px;max-width:82vw;
    background:var(--surface);border-right:1px solid var(--line);box-shadow:0 0 40px -8px rgba(0,0,0,.35);
    transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.7,.2,1);
    display:flex;flex-direction:column;padding:14px}
  .drawer.open{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .drawer-x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;width:34px;height:34px;border-radius:8px}
  .drawer-x:hover{background:var(--primary-soft);color:var(--primary)}
  .drawer-nav{display:flex;flex-direction:column;gap:3px}
  .drawer-nav button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:15.5px;
    text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer}
  .drawer-nav button:hover{background:var(--primary-soft)}
  .drawer-nav button.active{background:var(--ink);color:var(--paper)}
  body.drawer-lock{overflow:hidden}

  /* ---------- layout ---------- */
  main{max-width:var(--maxw);margin:0 auto;padding:22px 18px 80px}
  .hidden{display:none !important}

  /* ---------- browse / filters ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
  .search{position:relative;flex:1 1 260px;min-width:200px}
  .search input{
    width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line-strong);
    border-radius:11px;background:var(--surface);
  }
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:600;
  }
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.on.bimby{background:var(--bimby);border-color:var(--bimby)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;text-align:left;padding:0;position:relative;
    display:flex;flex-direction:column;transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 1px 0 var(--line),0 18px 34px -20px rgba(43,38,34,.5)}
  .card-open{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;width:100%;height:100%;cursor:pointer}
  .fav-btn{
    position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;border-radius:50%;
    border:0;background:rgba(255,255,255,.9);color:var(--muted);display:grid;place-items:center;
    box-shadow:0 2px 8px -2px rgba(43,38,34,.4);transition:transform .12s, color .12s;
  }
  .fav-btn:hover{transform:scale(1.1);color:var(--gold)}
  .fav-btn.on{color:var(--gold)}
  .card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .mini-tag{
    font-family:"Space Mono",monospace;font-size:10.5px;font-weight:700;
    background:var(--paper);color:var(--muted);border:1px solid var(--line);
    padding:2px 7px;border-radius:6px;
  }
  .mini-tag.click{cursor:pointer;background:var(--surface)}
  .mini-tag.click:hover{border-color:var(--primary);color:var(--primary)}
  .chips-lbl{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:2px}
  .chip.fav.on{background:var(--gold);border-color:var(--gold)}
  .chip.tagchip{font-family:"Space Mono",monospace;font-size:12px}
  .detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .tag-sugg{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .card .thumb{
    height:118px;display:grid;place-items:center;position:relative;
    background:
      radial-gradient(120% 120% at 80% 0%, rgba(255,255,255,.5), transparent 60%),
      linear-gradient(135deg,#F0E7D8,#E7DAC4);
  }
  .card .thumb .glyph{font-family:Fraunces;font-size:44px;color:var(--primary);opacity:.85}
  .card .thumb.photo{background:#EDE4D6 center/cover no-repeat}
  .card .thumb.photo.has-photo{background-size:cover}
  .card.bimby .thumb{background:linear-gradient(135deg,#DCEEEA,#C7E3DD)}
  .card.bimby .thumb .glyph{color:var(--bimby)}
  .badge{
    position:absolute;top:10px;left:10px;font-family:"Space Mono",monospace;
    font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    background:rgba(43,38,34,.82);color:#fff;padding:4px 8px;border-radius:6px;
  }
  .badge.bimby{background:var(--bimby)}
  .card .body{padding:14px 15px 16px}
  .card h3{font-size:19px;margin-bottom:6px}
  .card .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;font-family:"Space Mono",monospace}
  .card .cat{margin-top:9px;display:inline-block;font-size:12px;color:var(--primary);font-weight:600}
  .card.bimby .cat{color:var(--bimby)}

  .empty{
    border:1.5px dashed var(--line-strong);border-radius:var(--radius);
    padding:46px 24px;text-align:center;color:var(--muted);background:var(--surface)
  }
  .empty h3{color:var(--ink);font-size:22px;margin-bottom:8px}
  .empty button{margin-top:16px}

  /* ---------- buttons ---------- */
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    padding:10px 16px;border-radius:11px;font-weight:600;font-size:14.5px;transition:background .12s}
  .btn:hover{background:#FBF8F2}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:#922c22}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--ink)}
  .btn.danger{color:var(--primary);border-color:#E7C6C1}
  .btn.danger:hover{background:var(--primary-soft)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}

  /* ---------- detail ---------- */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:none;border:0;font-weight:600;margin-bottom:18px}
  .back:hover{color:var(--ink)}
  .detail-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .detail-head h1{font-size:clamp(30px,5vw,46px);max-width:620px;letter-spacing:-.01em}
  .tag{display:inline-flex;align-items:center;gap:6px;font-family:"Space Mono",monospace;font-size:11px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:7px}
  .tag.classica{background:var(--primary-soft);color:var(--primary)}
  .tag.bimby{background:var(--bimby-soft);color:var(--bimby)}
  .lead{color:var(--muted);max-width:620px;margin:12px 0 0;font-size:16.5px}
  .stats{display:flex;gap:26px;flex-wrap:wrap;margin:22px 0 6px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stat .k{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:Fraunces;font-size:21px;font-weight:600;margin-top:2px}

  .columns{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:34px;margin-top:26px;align-items:start}
  @media (max-width:760px){ .columns{grid-template-columns:1fr;gap:26px} }

  .panel h2{font-size:13px;font-family:"Space Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}

  /* porzioni stepper */
  .portions{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:18px}
  .portions .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .portions .lbl{font-weight:600}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line-strong);border-radius:11px;overflow:hidden}
  .stepper button{border:0;background:var(--surface);width:40px;height:40px;font-size:22px;color:var(--primary);line-height:1}
  .stepper button:hover{background:var(--primary-soft)}
  .stepper button:disabled{color:var(--line-strong);cursor:not-allowed;background:var(--surface)}
  .stepper .count{min-width:46px;text-align:center;font-family:"Space Mono",monospace;font-weight:700;font-size:17px}
  .portions .note{color:var(--muted);font-size:12.5px;margin-top:8px}
  .portions .note b{color:var(--ink)}

  ul.ingredients{list-style:none;margin:0;padding:0}
  ul.ingredients li{display:flex;gap:12px;padding:11px 2px;border-bottom:1px dashed var(--line);align-items:baseline}
  ul.ingredients li:last-child{border-bottom:0}
  .qty{font-family:"Space Mono",monospace;font-weight:700;color:var(--primary);white-space:nowrap;min-width:74px;font-size:14.5px;
       transition:color .18s}
  .qty.flash{color:var(--gold)}
  .ing-name{flex:1}

  ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
  ol.steps li{position:relative;padding:0 0 22px 46px;counter-increment:s}
  ol.steps li::before{
    content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;
    background:var(--ink);color:var(--paper);display:grid;place-items:center;
    font-family:"Space Mono",monospace;font-weight:700;font-size:13px;
  }
  ol.steps li::after{content:"";position:absolute;left:14px;top:32px;bottom:6px;width:2px;background:var(--line)}
  ol.steps li:last-child::after{display:none}
  .step-text{margin:4px 0 0}
  /* display Bimby */
  .bimby-panel{
    margin-top:10px;display:inline-flex;flex-wrap:wrap;gap:8px;
    background:var(--bimby);border-radius:11px;padding:9px 11px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), 0 6px 16px -10px rgba(21,117,106,.8);
  }
  .bchip{display:inline-flex;align-items:center;gap:5px;color:#EAFBF7;font-family:"Space Mono",monospace;
    font-size:12.5px;font-weight:700;letter-spacing:.02em}
  .bchip svg{opacity:.85}
  .bchip .sep{width:1px;height:14px;background:rgba(255,255,255,.25);margin:0 2px}

  /* ---------- admin form ---------- */
  .form-wrap{max-width:760px;margin:0 auto}
  .form-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .form-head h1{font-size:30px}
  .fh-tools{display:flex;align-items:center;gap:8px}
  .iconbtn:disabled{opacity:.35;cursor:not-allowed}
  .iconbtn:disabled:hover{background:var(--surface);color:var(--muted);border-color:var(--line-strong)}
  .draft-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:#FDF6E7;border:1px solid #EBD6A6;color:#7a5a11;border-radius:12px;padding:11px 14px;margin-bottom:16px;font-size:14px}
  .draft-banner .db-actions{display:flex;gap:8px}
  .field{margin-bottom:18px}
  .field>label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
  .field .hint{color:var(--muted);font-weight:400;font-size:12.5px}
  .control,select.control,textarea.control{
    width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);
  }
  textarea.control{resize:vertical;min-height:64px;line-height:1.45}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media (max-width:560px){ .two,.three{grid-template-columns:1fr} }

  fieldset.block{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 18px;background:var(--surface);overflow:hidden}
  fieldset.block legend{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);font-weight:700;
    float:left;width:100%;padding:0;margin:0 0 12px;display:block;} /* niente "notch": titolo interno normale */

  .ing-row{display:grid;grid-template-columns:84px 96px 1fr 38px;gap:8px;margin-bottom:9px;align-items:center}
  .ing-row input{padding:9px 10px;border:1px solid var(--line-strong);border-radius:9px;background:var(--paper);width:100%}
  @media (max-width:560px){ .ing-row{grid-template-columns:1fr 1fr 38px;grid-template-areas:"q u x" "n n n"} 
    .ing-row .iq{grid-area:q}.ing-row .iu{grid-area:u}.ing-row .in{grid-area:n}.ing-row .ix{grid-area:x} }

  .step-row{border:1px dashed var(--line-strong);border-radius:11px;padding:12px;margin-bottom:11px;background:var(--paper)}
  .step-row .top{display:flex;gap:10px;align-items:flex-start}
  .step-row .num{font-family:"Space Mono",monospace;font-weight:700;color:var(--muted);padding-top:9px;min-width:22px}
  .step-row textarea{flex:1}
  .bimby-fields{margin-top:10px;padding-top:11px;border-top:1px dashed var(--line-strong)}
  .bimby-fields .three input{padding:9px 10px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);width:100%}
  .bimby-fields .small{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bimby);font-weight:700}
  .bf-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .add-bimby{margin-top:11px;color:var(--bimby);border-color:var(--bimby-soft)}
  .add-bimby:hover{background:var(--bimby-soft)}
  .add-bimby svg{color:var(--bimby)}
  .rev{display:inline-flex;align-items:center;gap:7px;margin-top:9px;font-size:13.5px;color:var(--ink);cursor:pointer}
  .rev input{width:17px;height:17px;accent-color:var(--bimby)}
  .btn.tiny{padding:5px 9px;font-size:12px;border-radius:8px}

  .iconbtn{border:1px solid var(--line-strong);background:var(--surface);width:38px;height:38px;border-radius:9px;
    display:grid;place-items:center;color:var(--muted)}
  .iconbtn:hover{color:var(--primary);border-color:#E7C6C1;background:var(--primary-soft)}
  .add-line{display:inline-flex;align-items:center;gap:7px;margin-top:4px}

  .form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
  .form-actions .spacer{flex:1}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:11px;font-weight:600;font-size:14px;
    box-shadow:0 14px 30px -12px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.22s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .data-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}

  /* --- Scambio ricette --- */
  .share-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .share-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;
    border:1px solid var(--line);border-radius:var(--radius);padding:8px;background:var(--surface)}

  .sr-main{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sr-name{font-weight:600}
  .sr-sub{font-size:12.5px;color:var(--muted);font-family:"Space Mono",monospace}
  .sbadge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:2px 7px;border-radius:6px;vertical-align:middle;margin-left:6px;font-family:"Space Mono",monospace}

  .sbadge.dup{background:#EFE7DA;color:#8A8178}

  /* --- foto: galleria scheda --- */
  .detail-gallery{margin:20px 0 4px}

    background:#EDE4D6 center/cover no-repeat;display:grid;place-items:center;border:1px solid var(--line)}

  .dg-main.has-photo .dg-ph{display:none}
  .dg-thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .dg-thumb{width:64px;height:64px;border-radius:10px;border:2px solid transparent;cursor:pointer;
    background:#EDE4D6 center/cover no-repeat;padding:0}

  /* --- foto: striscia editor --- */
  .foto-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .foto-item{position:relative;width:92px;height:92px;border-radius:11px;border:1px solid var(--line-strong);
    background:#EDE4D6 center/cover no-repeat;overflow:hidden}
  .foto-item.cover{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
  .foto-cover-lbl{position:absolute;left:0;bottom:0;right:0;background:rgba(168,54,42,.85);color:#fff;
    font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:2px}
  .foto-del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;
    background:rgba(43,38,34,.7);color:#fff;display:grid;place-items:center;cursor:pointer;line-height:0}
  .foto-del:hover{background:var(--primary)}
  .foto-del svg{width:14px;height:14px}
  .incl-foto{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
  .incl-foto input{width:18px;height:18px;accent-color:var(--primary)}
  .share-pick p{color:var(--muted);margin:0 0 16px}

  /* --- azioni scheda ricetta --- */
  .detail-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start}
  .btn.iconlabel{display:inline-flex;align-items:center;gap:6px}
  .btn.iconlabel.fav-on{color:var(--gold);border-color:#EBD6A6;background:#FDF6E7}
  .btn.wake.on{background:var(--bimby);border-color:var(--bimby);color:#fff}
  @media (max-width:600px){ .detail-actions .btn.iconlabel span{display:none} }

  /* --- riordino passaggi --- */
  .step-btns{display:flex;gap:6px;align-items:flex-start}
  .move{display:flex;flex-direction:column;gap:3px}
  .iconbtn.xs{width:30px;height:23px;border-radius:7px}
  .iconbtn.xs:disabled{opacity:.35;cursor:not-allowed;background:var(--surface);color:var(--muted);border-color:var(--line)}
  .iconbtn.xs:disabled:hover{background:var(--surface);color:var(--muted);border-color:var(--line)}

  /* --- lista spesa --- */
  .spesa-add{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);margin:18px 0 18px}

  .spesa-list .sp-q{font-family:"Space Mono",monospace;color:var(--primary)}

  /* --- pianificazione pasti --- */
  .plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:18px 0}
  .plan-day{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px 14px}
  .pd-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:8px}

  .plan-slot{display:flex;gap:10px;padding:7px 0;align-items:flex-start}

  .ps-lbl{flex:0 0 78px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px}
  .ps-body{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
  .ps-empty{color:var(--line-strong)}
  .plan-chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;max-width:100%}
  .pc-name{border:0;background:transparent;color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;padding:2px 0;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc-del{border:0;background:transparent;color:var(--muted);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;cursor:pointer;line-height:0}
  .pc-del:hover{background:var(--primary);color:#fff}
  .pc-del svg{width:12px;height:12px}
  .plan-add{border:1px dashed var(--line-strong);border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:3px 8px;cursor:pointer;max-width:130px}
  .plan-actions{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 22px}
  .plan-spesa{margin-top:8px}

  /* --- statistiche --- */
  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center}
  .sc-num{font-family:Fraunces,serif;font-weight:600;font-size:30px;line-height:1;color:var(--primary)}
  .stat-card:nth-child(3) .sc-num{font-size:24px}
  .sc-lbl{margin-top:6px;font-size:12px;color:var(--muted);font-family:"Space Mono",monospace;letter-spacing:.04em;text-transform:uppercase}
  .stat-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
  .stat-bars{display:flex;flex-direction:column;gap:11px;margin-top:6px}
  .stat-bar .sb-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:4px}
  .sb-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-val{color:var(--muted);font-family:"Space Mono",monospace;font-size:12px;flex:0 0 auto}
  .sb-track{height:9px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
  .sb-fill{height:100%;background:linear-gradient(90deg,var(--primary),#c8621e);border-radius:6px}
  .stat-rank,.stat-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
  .stat-rank li,.stat-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .stat-rank li:last-child,.stat-list li:last-child{border-bottom:0}
  .stat-rank{counter-reset:rk}
  .stat-rank li::before{counter-increment:rk;content:counter(rk);font-family:"Space Mono",monospace;font-size:12px;color:var(--muted);flex:0 0 18px}
  .sr-count{font-family:"Space Mono",monospace;font-size:12px;color:var(--primary);flex:0 0 auto}
  .linklike{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;text-align:left;cursor:pointer;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linklike:hover{color:var(--primary);text-decoration:underline}

  /* --- opzioni / interruttori --- */
  .opt-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
  .opt-row:last-child{border-bottom:0}
  .opt-txt{flex:1 1 auto;min-width:0}
  .opt-lbl{font-weight:600;font-size:15px}
  .opt-desc{color:var(--muted);font-size:13px;margin-top:2px}
  .opt-row.is-disabled{opacity:.55}
  .switch{flex:0 0 auto;width:48px;height:28px;border-radius:999px;border:1px solid var(--line-strong);
    background:var(--paper);position:relative;cursor:pointer;transition:.18s;padding:0}
  .switch .knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line-strong);transition:.18s}
  .switch.on{background:var(--primary);border-color:var(--primary)}

  .switch:disabled{cursor:not-allowed}
  .opt-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
  .info-list{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
  .info-list li{font-size:14.5px;line-height:1.45}

  /* --- opzioni: segmenti, select, valore, azzeramenti --- */
  .opt-row.col{display:block}
  .opt-row.col .opt-txt{margin-bottom:8px}
  .seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg-btn{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:8px;cursor:pointer}
  .seg-btn.on{background:var(--primary);color:#fff}
  .opt-val{flex:0 0 auto;font-family:"Space Mono",monospace;font-size:13px;color:var(--muted)}
  .mini-sel{width:auto;flex:0 0 auto;padding:6px 10px}
  .danger-zone h2{color:var(--primary)}
  .backup-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:#FDF6E7;border:1px solid #EBD6A6;color:#7a5a11;border-radius:12px;padding:11px 14px;margin-bottom:16px;font-size:14px}
  body.theme-dark .backup-banner{background:#2c2413;border-color:#4a3d1c;color:#e7cf8f}
  .backup-banner .bb-actions{display:flex;gap:8px}
  body.no-anim *{transition:none !important;animation:none !important}

  /* --- modale export --- */
  .modal-overlay{position:fixed;inset:0;z-index:120;background:rgba(20,16,12,.55);
    display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
  .modal h2{margin-bottom:6px}
  .modal textarea{width:100%;height:200px;margin-top:10px;font-family:"Space Mono",monospace;font-size:12px;
    border:1px solid var(--line-strong);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink);resize:vertical}
  .modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  /* selettore ricetta con ricerca */
  .modal.picker{max-width:520px;display:flex;flex-direction:column;max-height:88vh}
  .picker-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .picker-search{margin-bottom:10px}
  .picker-list{flex:1 1 auto;overflow:auto;min-height:140px;display:flex;flex-direction:column;gap:1px}
  .pk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;
    text-align:left;padding:10px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--line)}
  .pk-row:hover,.pk-row.on{background:var(--primary-soft)}
  .pk-main{display:flex;flex-direction:column;gap:2px;min-width:0}
  .pk-name{font-weight:600}
  .pk-sub{font-size:12px;color:var(--muted);font-family:"Space Mono",monospace}
  .pk-check{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    background:var(--surface);border:1px solid var(--line-strong);color:var(--primary);font-weight:700}
  .pk-row.on .pk-check{background:var(--primary);color:#fff;border-color:var(--primary)}
  .picker-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .pk-port{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .pk-port input{width:64px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}

  /* --- filtri: pulsante home + pannello --- */
  .filter-btn{display:inline-flex;align-items:center;gap:6px}
  .filter-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .fb-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    background:var(--primary);color:#fff;font-size:11px;font-weight:700}
  .active-filters{font-size:13px;color:var(--muted);margin:-6px 0 16px}
  .modal.filter-modal{max-width:520px;display:flex;flex-direction:column;max-height:88vh;overflow:auto}
  .filter-group{margin-bottom:16px}
  .fg-lbl{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

  /* --- cosa cucino --- */
  .pantry-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:16px 0 20px}
  .pantry-inrow{display:flex;gap:8px;flex-wrap:wrap}
  .pantry-inrow input{flex:1 1 220px;min-width:180px;padding:11px 14px;border:1px solid var(--line-strong);border-radius:11px;background:var(--paper);color:var(--ink)}
  .pantry-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;min-height:8px}
  .pantry-chip{display:inline-flex;align-items:center;gap:5px;background:var(--primary-soft);border:1px solid var(--line);
    border-radius:999px;padding:4px 6px 4px 12px;font-weight:600;font-size:13.5px}
  .pantry-chip button{border:0;background:transparent;color:var(--muted);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;cursor:pointer;line-height:0}
  .pantry-chip button:hover{background:var(--primary);color:#fff}
  .pantry-chip svg{width:12px;height:12px}
  .pantry-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}

    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px}

    background:transparent;border:0;cursor:pointer;padding:8px}

  .cr-side{flex:0 0 auto;display:flex;align-items:center;gap:8px}
  .cr-name{font-weight:700}
  .cr-sub{font-size:12px;color:var(--muted);font-family:"Space Mono",monospace}
  .cr-miss{font-size:12.5px;color:var(--primary);margin-top:3px}
  .cr-badge{flex:0 0 auto;min-width:34px;height:28px;padding:0 8px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-family:"Space Mono",monospace;font-size:13px}

  .cr-badge.miss{background:var(--primary-soft);color:var(--primary)}

  .backup-box{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}

  .backup-box .bx-sub{font-size:13px;color:var(--muted);margin-top:2px}

  .share-row.is-done{opacity:.5}
  .share-row.is-done .sr-name{text-decoration:line-through}

  /* --- stampa / PDF --- */
  /* --- valutazione (stelle) --- */
  .stars{display:inline-flex;align-items:center;gap:2px}
  .star{border:0;background:transparent;padding:2px;cursor:pointer;color:var(--line-strong);line-height:0;border-radius:6px}

  .star.on{color:var(--gold)}

  /* --- pannello note --- */
  .note-panel{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .np-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .np-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:10px}
  .np-actions .hint{color:var(--bimby);font-weight:600}

  /* --- modalità cucina --- */
  body.cooking{overflow:hidden}
  .cook{position:fixed;inset:0;z-index:100;background:var(--paper);
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .cook.hidden{display:none}
  .cook-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}
  .cook-top-actions{display:flex;align-items:center;gap:6px}
  .cook-auto{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
    font-family:"Space Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:7px 11px;border-radius:9px;cursor:pointer}
  .cook-auto.on{background:var(--bimby);border-color:var(--bimby);color:#fff}
  #cookSpeak.speaking,.cook-x.speaking{color:var(--primary)}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .panel-head h2{margin:0}
  #readSteps.reading{background:var(--primary);border-color:var(--primary);color:#fff}
  ol.steps li.reading{background:var(--primary-soft);border-radius:10px;margin:-4px -8px;padding:0 8px 22px 46px !important}
  ol.steps li.reading::before{background:var(--primary)}
  .cook-title{font-family:Fraunces,serif;font-weight:600;font-size:19px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
  .cook-x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:10px;line-height:0}
  .cook-x:hover{background:var(--line);color:var(--ink)}

  .cook-progress{display:flex;gap:6px;flex-wrap:wrap;padding:6px 20px 0;justify-content:center}
  .cdot{width:26px;height:6px;border-radius:4px;border:0;background:var(--line-strong);cursor:pointer;padding:0}
  .cdot.done{background:var(--primary);opacity:.5}
  .cdot.on{background:var(--primary);opacity:1}
  .cook-stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:20px 24px;gap:22px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .cook-count{font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);font-weight:700}
  .cook-text{font-family:Fraunces,serif;font-weight:500;line-height:1.28;color:var(--ink);
    font-size:clamp(26px,5.2vw,44px);max-width:20ch}
  .cook-bimby{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .cook-chip{display:inline-flex;align-items:center;gap:7px;background:var(--bimby);color:#EAFBF7;
    font-family:"Space Mono",monospace;font-weight:700;font-size:16px;padding:10px 15px;border-radius:12px;
    box-shadow:0 6px 16px -8px rgba(21,117,106,.8)}

/* =====================================================================
   RICETTARIO — app offline (classico + Bimby), file unico.
   INDICE (cerca le intestazioni "===== NOME =====" per saltare):
     · Archiviazione persistente      localStorage (ricette, impostazioni, piano, dispensa)
     · Dati di esempio                primo avvio
     · Utility                        helper vari (esc, id, plural, warn…)
     · Foto: IndexedDB                salvataggio/compressione immagini
     · Wake Lock                      schermo sempre acceso in cucina
     · Lettura vocale                 SpeechSynthesis + plugin TTS
     · Stato                          oggetto App (dati + init + router go())
     · Icone                          SVG inline
     · Utility: ricerca intelligente  ricerca tollerante ad accenti/refusi
     · Utility: arrotondamento        dosi "belle" nella scalatura
     · Render: Scheda ricetta         dettaglio, scalatura porzioni
     · Valutazione e note             preferiti, stelle, note personali
     · Modalità cucina                passo-passo a schermo intero
     · Timer di cottura               countdown per passaggio + sveglia
     · Render: Gestione (form)        creazione/modifica ricetta
     · Salva variante porzioni
     · Lista della spesa              somma ingredienti + selettore
     · Pianificazione pasti           settimana + lista spesa dedicata
     · Statistiche d'uso
     · Cosa cucino con quello che ho  dispensa + mancanti alla spesa
     · Menu a scomparsa (drawer)
     · Selettore ricetta con ricerca  usato da Piano e Spesa
     · Opzioni / Info
     · Esportazione backup            persistente + condivisione nativa
     · Toast / Scorciatoie / Avvio
   ===================================================================== */

/* ===================== Archiviazione persistente ===================== */
/* Usa window.storage degli artifact; fallback in memoria se non disponibile. */
const DATA_KEY = "ricettario_v1";

const PIANO_KEY  = "ricettario_piano_v1";
const PIANO_SPESA_KEY = "ricettario_piano_spesa_v1";
const DISPENSA_KEY = "ricettario_dispensa_v1";
const GIORNI=[["lun","Lunedì"],["mar","Martedì"],["mer","Mercoledì"],["gio","Giovedì"],["ven","Venerdì"],["sab","Sabato"],["dom","Domenica"]];
const PASTI=[["colazione","Colazione"],["pranzo","Pranzo"],["cena","Cena"]];
const BOZZA_KEY  = "ricettario_bozza_v1";
const IMPOST_KEY = "ricettario_impostazioni_v1";
const SCHEMA_KEY = "ricettario_schema_v1";

function warn(ctx,e){ try{ console.warn("[Ricettario] "+ctx, e); }catch(_){} }
const mem = {};
let _storeWarned = false;
/* Persistenza standalone: localStorage (funziona offline in browser e WebView Android).
   Fallback in memoria se localStorage non è disponibile. */
const Store = {
  async get(key){
    try{ return localStorage.getItem(key); }
    catch(e){ return (key in mem) ? mem[key] : null; }
  },
  async set(key,val){
    try{ localStorage.setItem(key, val); _storeWarned=false; }
    catch(e){
      mem[key]=val; // fallback temporaneo
      if(!_storeWarned){
        _storeWarned=true;
        try{ toast("Spazio di archiviazione esaurito: le modifiche potrebbero non essere salvate. Esporta un backup."); }catch(_){}
      }
    }
  },
  async remove(key){
    try{ localStorage.removeItem(key); }catch(e){}
    delete mem[key];
  }
};

/* ===================== Utility ===================== */
function id(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6); }
function pid(){ return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6); }

/* ===================== Foto: IndexedDB + compressione ===================== */
/* Le ricette restano leggere in localStorage; le foto (blob JPEG compressi) stanno
   in IndexedDB, keyed per id. Nel JSON di scambio viaggiano solo se richiesto. */
const hasIDB = (typeof indexedDB !== "undefined");
const IDB = {
  _db:null,
  open(){
    return new Promise((res,rej)=>{
      if(this._db) return res(this._db);
      if(!hasIDB) return rej(new Error("no-idb"));
      const r=indexedDB.open("ricettario_media",1);
      r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("fotos")) r.result.createObjectStore("fotos",{keyPath:"id"}); };
      r.onsuccess=()=>{ this._db=r.result; res(this._db); };
      r.onerror=()=>rej(r.error);
    });
  },
  async put(rec){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("fotos","readwrite"); t.objectStore("fotos").put(rec); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
  async get(id){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const t=db.transaction("fotos","readonly"); const rq=t.objectStore("fotos").get(id); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); }); }catch(e){ warn("IDB.get",e); return null; } },
  async del(id){ try{ const db=await this.open(); return await new Promise((res)=>{ const t=db.transaction("fotos","readwrite"); t.objectStore("fotos").delete(id); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }catch(e){ warn("IDB.del",e); } },
  async clear(){ try{ const db=await this.open(); return await new Promise((res)=>{ const t=db.transaction("fotos","readwrite"); t.objectStore("fotos").clear(); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }catch(e){ warn("IDB.clear",e); } }
};

/* comprime un file immagine in JPEG ridimensionato (lato lungo max ~1200px) */
function compressImage(file, maxSide=1200, quality=0.82){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.naturalWidth, h=img.naturalHeight;
      if(!w||!h){ return rej(new Error("dim")); }
      if(Math.max(w,h)>maxSide){ const s=maxSide/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      const ctx=cv.getContext("2d"); ctx.drawImage(img,0,0,w,h);
      cv.toBlob(b=>{ b?res({blob:b,w,h}):rej(new Error("toBlob")); },"image/jpeg",quality);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src=url;
  });
}
function blobToDataURL(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob); }); }
function dataURLToBlob(d){
  try{
    const [meta,b64]=d.split(","); const mime=(meta.match(/:(.*?);/)||[])[1]||"image/jpeg";
    const bin=atob(b64); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }catch(e){ return null; }
}
/* elimina una foto SOLO se nessuna ricetta la referenzia (conteggio riferimenti:
   rende sicure duplicati e varianti che condividono le stesse foto) */
async function gcPhoto(fotoId){
  if(!fotoId) return;
  const used=App.recipes.some(r=>Array.isArray(r.foto)&&r.foto.includes(fotoId));
  if(!used) await IDB.del(fotoId);
}
/* riempie gli elementi con data-foto usando le immagini da IndexedDB */
function revokeUrls(){ (App._urls||[]).forEach(u=>{ try{URL.revokeObjectURL(u);}catch(e){} }); App._urls=[]; }
async function hydratePhotos(root){
  if(!hasIDB) return;
  const els=(root||document).querySelectorAll("[data-foto]");
  for(const el of els){
    const fid=el.getAttribute("data-foto"); if(!fid) continue;
    const rec=await IDB.get(fid);
    if(rec&&rec.blob){
      const u=URL.createObjectURL(rec.blob); (App._urls=App._urls||[]).push(u);
      if(el.tagName==="IMG") el.src=u; else el.style.backgroundImage=`url("${u}")`;
      el.classList.add("has-photo");
    }
  }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* escape per stringhe usate DENTRO un onclick="fn('...')" (contesto stringa JS in attributo HTML):
   prima neutralizzo apici/backslash per il JS, poi applico l'escape HTML dell'attributo. */
function jesc(s){ return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r?\n/g,"\\n"); }
function qattr(s){ return esc(jesc(s)); }
/* formatta una quantità: niente zeri inutili, virgola decimale italiana */
function fmtQty(n){
  if(n==null||n==="") return "";
  const r = Math.round(n*100)/100;
  let s = (Math.abs(r-Math.round(r))<1e-9) ? String(Math.round(r)) : r.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
  return s.replace(".",",");
}
function plural(n,one,many){ return n===1?one:many; }

/* ===================== Wake Lock (schermo sempre acceso) ===================== */
/* In app Android usa cordova-plugin-insomnia; nel browser la Screen Wake Lock API. */
/* ===================== Lettura vocale (SpeechSynthesis) ===================== */
const Speech = {
  _voice:null, _loaded:false,
  _hasWeb(){ return typeof window!=="undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window; },
  _hasPlugin(){ return typeof window!=="undefined" && window.TTS && typeof window.TTS.speak==="function"; },
  supported(){ return this._hasPlugin() || this._hasWeb(); },
  _loadVoices(){
    if(!this._hasWeb()) return;
    const vs=window.speechSynthesis.getVoices()||[];
    if(vs.length){
      this._voice = vs.find(v=>/^it(-|_|$)/i.test(v.lang)) || vs.find(v=>/it/i.test(v.name)) || null;
      this._loaded=true;
    }
  },
  init(){
    if(!this._hasWeb()) return;
    this._loadVoices();
    try{ window.speechSynthesis.onvoiceschanged=()=>this._loadVoices(); }catch(e){}
  },
  speaking(){ try{ return this._speakingFlag || (this._hasWeb() && window.speechSynthesis.speaking); }catch(e){ return false; } },
  stop(){
    this._speakingFlag=false;
    try{ if(this._hasPlugin() && window.TTS.stop) window.TTS.stop(); }catch(e){}
    try{ if(this._hasWeb()) window.speechSynthesis.cancel(); }catch(e){}
  },
  _rate(){ try{ return (App&&App.settings&&App.settings.voceRate)||1; }catch(e){ return 1; } },
  _utter(text){
    const u=new SpeechSynthesisUtterance(text);
    u.lang="it-IT"; u.rate=this._rate(); u.pitch=1;
    if(!this._loaded) this._loadVoices();
    if(this._voice) u.voice=this._voice;
    return u;
  },
  speak(text){
    if(!text) return;
    this.stop();
    if(this._hasPlugin()){
      this._speakingFlag=true;
      try{ const p=window.TTS.speak({text, locale:"it-IT", rate:this._rate()}); if(p&&p.then) p.then(()=>{this._speakingFlag=false;},()=>{this._speakingFlag=false;}); }
      catch(e){ this._speakingFlag=false; if(this._hasWeb()) window.speechSynthesis.speak(this._utter(text)); }
      return;
    }
    if(this._hasWeb()) window.speechSynthesis.speak(this._utter(text));
  },
  /* legge una sequenza di testi uno dopo l'altro */
  speakList(texts, onStep){
    if(!this.supported() || !texts.length) return;
    this.stop();
    let i=0;
    const next=()=>{
      if(i>=texts.length){ this._speakingFlag=false; return; }
      if(onStep) try{ onStep(i); }catch(e){}
      if(this._hasPlugin()){
        this._speakingFlag=true;
        try{ const p=window.TTS.speak({text:texts[i], locale:"it-IT", rate:this._rate()});
             if(p&&p.then) p.then(()=>{ i++; next(); },()=>{ this._speakingFlag=false; }); else { i++; next(); } }
        catch(e){ this._speakingFlag=false; }
      } else {
        const u=this._utter(texts[i]);
        u.onend=()=>{ i++; next(); };
        window.speechSynthesis.speak(u);
      }
    };
    next();
  }
};
/* trasforma i parametri Bimby in un testo leggibile a voce */
function speakBimby(b){
  if(!b) return "";
  const norm=s=>String(s||"")
    .replace(/°\s*C/gi," gradi").replace(/°/g," gradi")
    .replace(/\bmin\b/gi,"minuti").replace(/\bsec\b/gi,"secondi").replace(/\bvel\b/gi,"velocità");
  const parts=[];
  if(b.tempo) parts.push("tempo "+norm(b.tempo));
  if(b.temp)  parts.push("temperatura "+norm(b.temp));
  if(b.vel)   parts.push("velocità "+norm(b.vel));
  if(b.antiorario) parts.push("in senso antiorario");
  return parts.join(", ");
}
function stepSpeakText(p){
  let t=(p.testo||"").trim();
  const b=speakBimby(p.bimby);
  if(b){ t=t.replace(/[.\s]+$/,""); t+= ". Impostazioni Bimby: "+b; }
  return t;
}

const Wake = {
  on:false,
  _sentinel:null,
  supported(){
    return !!(window.plugins && window.plugins.insomnia) || ("wakeLock" in navigator);
  },
  async enable(){
    try{
      if(window.plugins && window.plugins.insomnia){ window.plugins.insomnia.keepAwake(); this.on=true; return true; }
      if("wakeLock" in navigator){
        this._sentinel = await navigator.wakeLock.request("screen");
        this._sentinel.addEventListener("release",()=>{ this._sentinel=null; });
        this.on=true; return true;
      }
    }catch(e){}
    this.on=false; return false;
  },
  async disable(){
    try{
      if(window.plugins && window.plugins.insomnia) window.plugins.insomnia.allowSleepAgain();
      if(this._sentinel){ await this._sentinel.release(); this._sentinel=null; }
    }catch(e){}
    this.on=false;
  },
  async toggle(){
    if(this.on){ await this.disable(); toast("Schermo libero di spegnersi"); }
    else{
      const ok=await this.enable();
      toast(ok? "Schermo sempre acceso" : "Non supportato su questo dispositivo");
    }
    const b=document.getElementById("wakeBtn");
    if(b){ b.classList.toggle("on",this.on); b.setAttribute("aria-pressed",this.on?"true":"false"); }
  }
};

/* ===================== Render: Ricettario ===================== */
/* ===================== Utility: ricerca intelligente ===================== */
function stripAccents(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
function lev(a,b){ // distanza di Levenshtein con uscita anticipata
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  if(Math.abs(m-n)>2) return 3;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i; let best=cur[0];
    for(let j=1;j<=n;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
      if(cur[j]<best) best=cur[j];
    }
    if(best>2) return 3; // oltre soglia: inutile continuare
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function tokenMatch(token, words, hay){
  if(hay.includes(token)) return true;            // sottostringa diretta (gestisce "parmig")
  const thr = token.length<=4?1:2;                // tolleranza refusi in base alla lunghezza
  for(const w of words){
    if(w.length>=3 && w.includes(token)) return true;  // parola che contiene il termine (prefissi)
    if(w.length>=3 && lev(token,w)<=thr) return true;  // gestisce "pomdoro" -> "pomodoro"
  }
  return false;
}
function smartSearch(query, recipes){
  const tokens = stripAccents(query).split(/\s+/).filter(Boolean);
  if(!tokens.length) return recipes;
  return recipes.filter(r=>{
    const passaggi=(r.passaggi||[]).map(p=>p.testo||"").join(" ");
    const hay = stripAccents([
      r.nome, r.categoria, (r.tags||[]).join(" "),
      r.ingredienti.map(i=>i.n).join(" "),
      r.descrizione||"", r.note||"", passaggi
    ].join(" "));
    const words = hay.split(/[\s,;.]+/).filter(Boolean);
    return tokens.every(t=>tokenMatch(t, words, hay)); // tutte le parole cercate devono combaciare
  });
}

/* ===================== Utility: arrotondamento intelligente ===================== */
const COUNTABLE=new Set(["","n","pz","pezzo","pezzi","uovo","uova","spicchio","spicchi","fetta","fette",
  "foglia","foglie","rametto","rametti","mazzo","mazzetto","bustina","bustine","confezione","scatola","barattolo"]);
function niceRound(v, unit){
  if(v==null||isNaN(v)) return v;
  const u=(unit||"").trim().toLowerCase();
  if(COUNTABLE.has(u)){                 // ingredienti "a pezzo": interi (mezzo consentito sotto 3)
    if(v<3) return Math.round(v*2)/2;   // 1,5 uova ok; sotto le 3 unità arrotondo al mezzo
    return Math.round(v);
  }
  const a=Math.abs(v);
  if(a>=100) return Math.round(v/5)*5;  // 266,6 -> 265
  if(a>=20)  return Math.round(v);       // 47,3 -> 47
  if(a>=1)   return Math.round(v*10)/10; // 7,84 -> 7,8
  return Math.round(v*100)/100;          // 0,266 -> 0,27
}
function smartScale(q, unit, factor){ return niceRound(q*factor, unit); }


let _backupDismissed=false;
function backupBannerHTML(){
  const S=App.settings||{};
  if(!S.backupReminder || _backupDismissed || !App.recipes.length) return "";
  const d=daysSince(S.lastBackup);
  const overdue = (d===null) || d>=14;   // mai, oppure oltre 2 settimane
  if(!overdue) return "";
  const msg = d===null ? "Non hai ancora fatto un backup delle tue ricette."
                       : `Ultimo backup ${d} giorni fa.`;
  return `<div class="backup-banner no-print">
    <span>${msg} Un export mette al sicuro tutto.</span>
    <span class="bb-actions">
      <button class="btn sm primary" onclick="App.openShare('export')">Esporta ora</button>
      <button class="btn sm" onclick="dismissBackup()">Più tardi</button>
    </span></div>`;
}

function activeFilterCount(){
  const f=App.filters; let n=0;
  if(f.tipo!=="all") n++; if(f.vista!=="tutte") n++; if(f.cat!=="all") n++; if(f.tag!=="all") n++;
  return n;
}
function activeFiltersText(){
  const f=App.filters, p=[];
  if(f.tipo==="classica") p.push("Classiche"); if(f.tipo==="bimby") p.push("Bimby");
  if(f.vista==="preferiti") p.push("Preferiti"); if(f.vista==="recenti") p.push("Recenti");
  if(f.cat!=="all") p.push(esc(f.cat));
  if(f.tag!=="all") p.push("#"+esc(f.tag));
  return "Filtri attivi: "+p.join(" · ");
}
function computeList(f){
  let list=App.recipes.filter(r=>{
    if(f.vista==="preferiti" && !r.preferito) return false;
    if(f.vista==="recenti" && !App.recents.includes(r.id)) return false;
    if(f.tipo!=="all" && r.tipo!==f.tipo) return false;
    if(f.cat!=="all" && r.categoria!==f.cat) return false;
    if(f.tag!=="all" && !(r.tags||[]).includes(f.tag)) return false;
    return true;
  });
  if(f.q) list=smartSearch(f.q, list);                 // ricerca tollerante ad accenti e refusi
  if(f.vista==="recenti"){ list.sort((a,b)=>App.recents.indexOf(a.id)-App.recents.indexOf(b.id)); }
  else {
    const ord=(App.settings&&App.settings.ordine)||"nome";
    if(ord==="aperte") list.sort((a,b)=>(b.aperture||0)-(a.aperture||0) || a.nome.localeCompare(b.nome,'it'));
    else if(ord==="recenti") list.sort((a,b)=>{ const ia=App.recents.indexOf(a.id), ib=App.recents.indexOf(b.id);
      const va=ia<0?9999:ia, vb=ib<0?9999:ib; return va-vb || a.nome.localeCompare(b.nome,'it'); });
    else list.sort((a,b)=>a.nome.localeCompare(b.nome,'it'));
  }
  return list;
}
function updateGrid(){
  const g=document.getElementById("grid"); if(!g) return;
  revokeUrls(); // libero gli object URL della griglia precedente (evita accumulo durante la ricerca)
  const f=App.filters;
  const list=computeList(f);
  g.innerHTML = list.length
    ? `<div class="grid">${list.map(r=>cardHTML(r)).join("")}</div>`
    : `<div class="empty"><h3>${emptyTitle(f)}</h3>
         <p>${App.recipes.length? "Prova a cambiare i filtri o la ricerca." : "Inizia aggiungendo la tua prima ricetta."}</p>
         <button class="btn primary" onclick="App.newRecipe()">Aggiungi ricetta</button></div>`;
  hydratePhotos(g);
}
function emptyTitle(f){
  if(f.vista==="preferiti") return "Nessun preferito";
  if(f.vista==="recenti") return "Nessuna ricetta recente";
  if(f.q) return "Nessun risultato";
  return "Nessuna ricetta qui";
}

  wrap.onclick=(e)=>{ if(e.target===wrap) closeFilter(); };

async function galleryPick(btn, fid){
  const main=document.querySelector("#gallery .dg-main"); if(!main) return;
  const rec=await IDB.get(fid);
  if(rec&&rec.blob){ const u=URL.createObjectURL(rec.blob); (App._urls=App._urls||[]).push(u); main.style.backgroundImage=`url("${u}")`; main.classList.add("has-photo"); }
  document.querySelectorAll("#gallery .dg-thumb").forEach(t=>t.classList.remove("on"));
  btn.classList.add("on");
}

function ingLI(i,idx){
  const scalable = i.q!=null && i.q!=="";
  const qtxt = scalable ? (fmtQty(niceRound(i.q,i.u))+(i.u?(" "+esc(i.u)):"")) : (i.u?esc(i.u):"q.b.");
  return `<li>
    <span class="qty" data-q="${scalable?i.q:''}" data-u="${esc(i.u||'')}" data-i="${idx}">${qtxt}</span>
    <span class="ing-name">${esc(i.n)}</span>
  </li>`;
}
function updateQuantities(){
  document.querySelectorAll(".qty[data-q]").forEach(el=>{
    const base=el.getAttribute("data-q"); if(base==="") return;
    const u=el.getAttribute("data-u");
    const val=smartScale(parseFloat(base), u, App.scale);   // arrotondamento intelligente
    const txt=fmtQty(val)+(u?(" "+u):"");
    if(el.textContent!==txt){ el.textContent=txt; el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),320); }
  });
  const c=document.getElementById("pcount"); if(c) c.textContent=App.curPortions;
  const sp=document.getElementById("statPort"); if(sp) sp.textContent=App.curPortions;
  const m=document.getElementById("pminus"); if(m) m.disabled=App.curPortions<=1;
  const sv=document.getElementById("saveVariant");
  if(sv){ const r=App.find(App.currentId); sv.style.display=(r&&App.curPortions!==r.porzioniBase)?"block":"none"; }
}

function stepLI(p){
  let b="";
  if(p.bimby){
    const parts=[];
    if(p.bimby.tempo) parts.push(`<span class="bchip">${I.clock}${esc(p.bimby.tempo)}</span>`);
    if(p.bimby.temp)  parts.push(`<span class="bchip">${I.thermo}${esc(p.bimby.temp)}</span>`);
    if(p.bimby.vel)   parts.push(`<span class="bchip">${I.speed}vel ${esc(p.bimby.vel)}</span>`);
    if(p.bimby.antiorario) parts.push(`<span class="bchip">${I.reverse}antiorario</span>`);
    if(parts.length) b=`<div class="bimby-panel">${parts.join('<span class="sep"></span>')}</div>`;
  }
  return `<li><p class="step-text">${esc(p.testo)}</p>${b}</li>`;
}
/* legge tutti i passaggi in sequenza (scheda ricetta); ri-cliccando si ferma */
function readAllSteps(rid){
  const r=App.find(rid); if(!r) return;
  const btn=document.getElementById("readSteps");
  if(Speech.speaking()){ Speech.stop(); if(btn){ btn.classList.remove("reading"); btn.querySelector("span").textContent="Leggi"; } return; }
  const texts=r.passaggi.map((p,i)=>`Passaggio ${i+1}. ${stepSpeakText(p)}`);
  if(btn){ btn.classList.add("reading"); btn.querySelector("span").textContent="Stop"; }
  Speech.speakList(texts, (i)=>{
    // evidenzio il passaggio in lettura
    document.querySelectorAll("ol.steps li").forEach((li,k)=>li.classList.toggle("reading",k===i));
  });
  // quando finisce, ripristino il pulsante
  const check=setInterval(()=>{
    if(!Speech.speaking()){ clearInterval(check);
      if(btn){ btn.classList.remove("reading"); btn.querySelector("span").textContent="Leggi"; }
      document.querySelectorAll("ol.steps li.reading").forEach(li=>li.classList.remove("reading"));
    }
  },600);
}

/* ===================== Valutazione e note ===================== */
function starsHTML(rating, rid){
  let out='<span class="stars" role="radiogroup" aria-label="Valutazione">';
  for(let n=1;n<=5;n++){
    out+=`<button class="star ${n<=rating?'on':''}" onclick="setRating('${rid}',${n})" aria-label="${n} su 5" title="${n}/5">${n<=rating?I.starFill:I.star}</button>`;
  }
  if(rating>0) out+=`<button class="star clear" onclick="setRating('${rid}',0)" title="Azzera">×</button>`;
  out+='</span>';
  return out;
}
async function setRating(rid, n){
  const r=App.find(rid); if(!r) return;
  r.rating = (r.rating===n) ? 0 : n; // ritocca sullo stesso valore = azzera
  await App.save();
  if(App.view==="detail") renderDetail(); else if(App.view==="browse") renderBrowse();
}
async function saveNote(rid){
  const r=App.find(rid); if(!r) return;
  const box=document.getElementById("noteBox"); if(!box) return;
  r.note=box.value.trim();
  await App.save();
  const st=document.getElementById("noteStatus");
  if(st){ st.textContent="Note salvate ✓"; setTimeout(()=>{ if(st) st.textContent=""; },2000); }
  toast("Note salvate");
}

/* ===================== Modalità cucina ===================== */
function startCook(){
  const r=App.find(App.currentId); if(!r || !r.passaggi.length) return;
  App.cookActive=true; App.cookStep=0;
  App._wakeWas=Wake.on;
  if(!Wake.on) Wake.enable();               // schermo acceso automaticamente
  document.body.classList.add("cooking");
  setBackgroundInert(true);   // impedisce al focus di finire dietro l'overlay
  const el=document.getElementById("cook");
  el.classList.remove("hidden"); el.setAttribute("aria-hidden","false");
  renderCook();
  document.addEventListener("keydown", cookKeys);
  bindCookSwipe();
}
function setBackgroundInert(on){
  ["app"].forEach(id=>{ const el=document.getElementById(id); if(el){ try{ el.inert=on; }catch(e){} } });
  const bar=document.querySelector("header.bar"); if(bar){ try{ bar.inert=on; }catch(e){} }
}
async function endCook(){
  App.cookActive=false;
  Speech.stop();
  clearTimeout(App._cookTimer);
  CookTimer.stop();
  const el=document.getElementById("cook");
  el.classList.add("hidden"); el.setAttribute("aria-hidden","true"); el.innerHTML="";
  document.body.classList.remove("cooking");
  setBackgroundInert(false);
  document.removeEventListener("keydown", cookKeys);
  if(!App._wakeWas) await Wake.disable();    // ripristino lo stato precedente
}
function cookGo(dir){
  const r=App.find(App.currentId); if(!r) return;
  const n=r.passaggi.length;
  const next=App.cookStep+dir;
  if(next<0 || next>=n) return;
  Speech.stop();
  App.cookStep=next; renderCook();
}
function cookGoto(i){ Speech.stop(); App.cookStep=i; renderCook(); }
function cookKeys(e){
  if(!App.cookActive) return;
  if(e.key==="ArrowRight") cookGo(1);
  else if(e.key==="ArrowLeft") cookGo(-1);
  else if(e.key==="Escape") endCook();
}
function bindCookSwipe(){
  const el=document.getElementById("cook");
  let x0=null,y0=null;
  el.addEventListener("touchstart",e=>{ const t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; },{passive:true});
  el.addEventListener("touchend",e=>{
    if(x0==null) return;
    const t=e.changedTouches[0]; const dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ cookGo(dx<0?1:-1); }
    x0=y0=null;
  },{passive:true});
}
/* ===================== Timer di cottura (con sveglia) ===================== */
function fmtSec(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), ss=s%60; return m+":"+(ss<10?"0":"")+ss; }
function parseTimeToSec(str){
  if(!str) return 0;
  const s=String(str).toLowerCase().trim();
  let mm=s.match(/^(\d+):(\d{1,2})$/); if(mm) return parseInt(mm[1])*60+parseInt(mm[2]);
  let sec=0, found=false, m;
  if((m=s.match(/(\d+)\s*h/)))            { sec+=parseInt(m[1])*3600; found=true; }
  if((m=s.match(/(\d+)\s*m(in|inuti)?\b/))){ sec+=parseInt(m[1])*60;   found=true; }
  if((m=s.match(/(\d+)\s*s(ec|econdi)?\b/))){ sec+=parseInt(m[1]);     found=true; }
  if(!found){ const n=parseInt(s); if(!isNaN(n)) sec=n*60; } // numero nudo = minuti
  return sec;
}
function beepAlarm(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    const ctx=new Ctx(); let t=ctx.currentTime;
    for(let k=0;k<3;k++){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      o.start(t); o.stop(t+0.37); t+=0.5;
    }
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 2200);
  }catch(e){}
}
const CookTimer = {
  total:0, remaining:0, running:false, _id:null,
  set(sec){ this.stop(); this.total=sec; this.remaining=sec; this.render(); },
  add(sec){ this.remaining=Math.max(0,this.remaining+sec); this.total=Math.max(this.total,this.remaining); this.render(); },
  start(){ if(this.remaining<=0) return; this.running=true; clearInterval(this._id);
    this._id=setInterval(()=>{ this.remaining--; if(this.remaining<=0){ this.remaining=0; this.finish(); } this.render(); },1000); this.render(); },
  pause(){ this.running=false; clearInterval(this._id); this._id=null; this.render(); },
  toggle(){ this.running? this.pause() : this.start(); },
  reset(){ this.stop(); this.remaining=0; this.total=0; const w=document.getElementById("cookTimer"); if(w) w.classList.remove("ringing"); this.render(); },
  stop(){ this.running=false; clearInterval(this._id); this._id=null; },
  finish(){ this.stop(); beepAlarm(); try{ navigator.vibrate && navigator.vibrate([300,150,300,150,500]); }catch(e){}
    toast("⏰ Timer finito!"); const w=document.getElementById("cookTimer"); if(w) w.classList.add("ringing"); },
  fmt(){ return fmtSec(this.remaining); },
  render(){
    const d=document.getElementById("ctDisplay"); if(d) d.textContent=this.fmt();
    const b=document.getElementById("ctToggle"); if(b) b.textContent=this.running?"Pausa":"Avvia";
    const w=document.getElementById("cookTimer"); if(w){ w.classList.toggle("running",this.running); if(this.remaining>0) w.classList.remove("ringing"); }
  }
};

function cookTimerHTML(p){
  const stepSec = p && p.bimby ? parseTimeToSec(p.bimby.tempo) : 0;
  const setBtn = stepSec ? `<button class="ct-set" onclick="CookTimer.set(${stepSec});CookTimer.start();">▶ Avvia ${fmtSec(stepSec)}</button>` : "";
  return `<div class="cook-timer" id="cookTimer">
    <div class="ct-display" id="ctDisplay">${CookTimer.fmt()}</div>
    <div class="ct-btns">
      ${setBtn}
      <button class="ct-b" onclick="CookTimer.add(60)">+1:00</button>
      <button class="ct-b" onclick="CookTimer.add(30)">+0:30</button>
      <button class="ct-b" id="ctToggle" onclick="CookTimer.toggle()">${CookTimer.running?"Pausa":"Avvia"}</button>
      <button class="ct-b ghost" onclick="CookTimer.reset()">Azzera</button>
    </div>
  </div>`;
}
function renderCook(){
  const r=App.find(App.currentId); if(!r){ endCook(); return; }
  const n=r.passaggi.length;
  const i=App.cookStep;
  const p=r.passaggi[i];
  const isLast=i===n-1, isFirst=i===0;

  // parametri Bimby (più grandi)
  let bimby="";
  if(p.bimby){
    const parts=[];
    if(p.bimby.tempo) parts.push(`<span class="cook-chip">${I.clock}${esc(p.bimby.tempo)}</span>`);
    if(p.bimby.temp)  parts.push(`<span class="cook-chip">${I.thermo}${esc(p.bimby.temp)}</span>`);
    if(p.bimby.vel)   parts.push(`<span class="cook-chip">${I.speed}vel ${esc(p.bimby.vel)}</span>`);
    if(p.bimby.antiorario) parts.push(`<span class="cook-chip">${I.reverse}antiorario</span>`);
    if(parts.length) bimby=`<div class="cook-bimby">${parts.join("")}</div>`;
  }

  const dots=r.passaggi.map((_,k)=>`<button class="cdot ${k===i?'on':''} ${k<i?'done':''}" onclick="cookGoto(${k})" aria-label="Passaggio ${k+1}"></button>`).join("");

  const el=document.getElementById("cook");
  const voiceCtrls = Speech.supported() ? `
      <button class="cook-x" id="cookSpeak" onclick="cookSpeak()" aria-label="Leggi il passaggio" title="Leggi il passaggio">${I.speaker}</button>
      <button class="cook-auto ${App.settings.autoLeggi?'on':''}" onclick="toggleAutoLeggi()" aria-pressed="${App.settings.autoLeggi?'true':'false'}" title="Lettura automatica dei passaggi">Auto</button>` : "";
  el.innerHTML=`
    <div class="cook-top">
      <div class="cook-title">${esc(r.nome)}</div>
      <div class="cook-top-actions">
        ${voiceCtrls}
        <button class="cook-x" onclick="endCook()" aria-label="Esci dalla modalità cucina">${I.close}</button>
      </div>
    </div>
    <div class="cook-progress">${dots}</div>

    <div class="cook-stage" id="cookStage">
      <div class="cook-count">Passaggio ${i+1} di ${n}</div>
      <div class="cook-text">${esc(p.testo)}</div>
      ${bimby}
      ${cookTimerHTML(p)}
      <div class="cook-hint">${isLast?'Ultimo passaggio':'Tocca il testo per continuare · scorri o usa le frecce'}</div>
    </div>

    <div class="cook-nav">
      <button class="cook-btn ghost" onclick="cookGo(-1)" ${isFirst?'disabled':''}>${I.arrowL} Indietro</button>
      <button class="cook-btn ing" onclick="toggleCookIng()" aria-label="Ingredienti">${I.list}</button>
      ${isLast
        ? `<button class="cook-btn done" onclick="endCook()">Fine ✓</button>`
        : `<button class="cook-btn primary" onclick="cookGo(1)">Avanti ${I.arrowR}</button>`}
    </div>

    <div class="cook-sheet hidden" id="cookSheet">
      <div class="cs-head"><b>Ingredienti</b> <span class="hint">${App.curPortions} ${plural(App.curPortions,'porzione','porzioni')}</span>
        <button class="cook-x sm" onclick="toggleCookIng()" aria-label="Chiudi">${I.close}</button></div>
      <ul class="cs-list">${r.ingredienti.map(ing=>{
        const scal = ing.q!=null && ing.q!=="";
        const q = scal ? fmtQty(smartScale(ing.q,ing.u,App.scale))+(ing.u?' '+esc(ing.u):'') : (ing.u?esc(ing.u):'q.b.');
        return `<li><span class="cs-q">${q}</span> <span>${esc(ing.n)}</span></li>`;
      }).join("")}</ul>
    </div>
  `;
  // tap sul testo per avanzare (i controlli del timer non fanno avanzare)
  const txt=el.querySelector(".cook-text");
  if(txt) txt.onclick=()=>{ if(!isLast) cookGo(1); };
  // lettura automatica del passaggio, se attiva
  if(App.settings.autoLeggi && Speech.supported()){ Speech.speak(stepSpeakText(p)); }
  // avanzamento automatico, se attivo
  clearTimeout(App._cookTimer);
  if(App.settings.cucinaAuto && !isLast){
    App._cookTimer=setTimeout(()=>{ if(App.cookActive) cookGo(1); }, (App.settings.cucinaAutoSec||20)*1000);
  }
}
function cookSpeak(){
  const r=App.find(App.currentId); if(!r) return;

function allKnownTags(){ return Array.from(new Set(App.recipes.flatMap(r=>r.tags||[]))).sort(); }
/* riusa una categoria esistente se combacia a meno di maiuscole/accenti/spazi (anti-duplicati) */
function canonicalCategory(input){
  const t=(input||"").trim();
  if(!t) return "Senza categoria";
  const key=stripAccents(t);
  const exist=App.recipes.map(r=>r.categoria).filter(Boolean);
  const hit=exist.find(c=>stripAccents(c)===key);
  return hit || t;   // se esiste già "Primi piatti", "primi piatti" diventa "Primi piatti"
}
function parseTags(s){
  return Array.from(new Set(
    (s||"").split(",").map(t=>t.trim().toLowerCase().replace(/^#/,"")).filter(Boolean)
  )).slice(0,12);
}
function addTagToField(t){
  const el=document.getElementById("f_tags"); if(!el) return;
  const cur=parseTags(el.value);
  if(cur.includes(t.toLowerCase())) return;
  cur.push(t.toLowerCase());
  el.value=cur.join(", ");
  el.focus();
}

function histSnapshot(){ return { ings:JSON.parse(JSON.stringify(App.draftIngs)), steps:JSON.parse(JSON.stringify(App.draftSteps)) }; }

function readDraftFromDOM(){
  // ingredienti
  App.draftIngs = Array.from(document.querySelectorAll("#ingList .ing-row")).map(row=>({
    q: row.querySelector(".iq").value.trim().replace(",", "."),
    u: row.querySelector(".iu").value.trim(),
    n: row.querySelector(".in").value.trim()
  }));
  // passaggi
  App.draftSteps = Array.from(document.querySelectorAll("#stepList .step-row")).map(row=>{
    const t=row.querySelector(".st-text").value;
    const bf=row.querySelector(".bimby-fields");
    let bimby=null;
    if(bf){
      bimby={
        tempo: row.querySelector(".b-tempo").value.trim(),
        temp: row.querySelector(".b-temp").value.trim(),
        vel: row.querySelector(".b-vel").value.trim(),
        antiorario: row.querySelector(".b-anti").checked
      };
    }
    return {testo:t, bimby};
  });
}

const MAX_FOTO=6;

async function onAddPhoto(input){
  const file=input.files&&input.files[0]; input.value="";
  if(!file) return;
  if(App.draftFoto.length>=MAX_FOTO){ toast(`Massimo ${MAX_FOTO} foto`); return; }
  if(!/^image\//.test(file.type)){ toast("Serve un file immagine"); return; }
  toast("Elaboro la foto…");
  try{
    const {blob,w,h}=await compressImage(file);
    const fid=pid();
    await IDB.put({id:fid, blob, tipo:"image/jpeg", w, h, ts:Date.now()});
    App.draftFoto.push(fid);
    App._sessionPhotos.add(fid);   // se annullo, va rimossa
    renderFotoStrip();
    autosaveDraft();
  }catch(e){ toast("Foto non valida"); }
}
async function removeDraftPhoto(fid){
  App.draftFoto = App.draftFoto.filter(x=>x!==fid);
  if(App._sessionPhotos.has(fid)){       // aggiunta ora e non salvata: elimino subito
    App._sessionPhotos.delete(fid);
    await gcPhoto(fid);
  }
  // se era una foto già salvata, la eliminazione effettiva avviene al salvataggio (gcPhoto)
  renderFotoStrip();
  autosaveDraft();
}

async function saveRecipe(){
  readDraftFromDOM();
  const nome=document.getElementById("f_nome").value.trim();
  if(!nome){ toast("Dai un nome alla ricetta"); document.getElementById("f_nome").focus(); return; }

  const ings=App.draftIngs
    .filter(i=>i.n)
    .map(i=>({ q: (i.q===""||i.q==null||isNaN(parseFloat(i.q)))?null:parseFloat(i.q), u:i.u, n:i.n }));
  const steps=App.draftSteps.filter(p=>p.testo && p.testo.trim()).map(p=>{
    let b=p.bimby;
    if(b && !b.tempo && !b.temp && !b.vel && !b.antiorario) b=null; // bimby vuoto -> niente
    return {testo:p.testo.trim(), bimby:b?{tempo:b.tempo,temp:b.temp,vel:b.vel,antiorario:!!b.antiorario}:null};
  });

  if(!ings.length){ toast("Aggiungi almeno un ingrediente"); return; }
  if(!steps.length){ toast("Aggiungi almeno un passaggio"); return; }

  let tipo=document.getElementById("f_tipo").value;
  if(steps.some(p=>p.bimby)) tipo="bimby"; // se ci sono parametri Bimby, è una ricetta Bimby

  const prev = App.currentId ? App.find(App.currentId) : null;
  const prevFoto = prev && Array.isArray(prev.foto) ? prev.foto.slice() : [];
  const rec={
    id: App.currentId || id(),
    tipo,
    nome,
    categoria: canonicalCategory(document.getElementById("f_cat").value),
    porzioniBase: Math.max(1, parseInt(document.getElementById("f_porz").value)||4),
    tempo: parseInt(document.getElementById("f_tempo").value)||0,
    difficolta: document.getElementById("f_diff").value,
    descrizione: document.getElementById("f_desc").value.trim(),
    tags: parseTags(document.getElementById("f_tags").value),
    note: document.getElementById("f_note").value.trim(),
    preferito: prev ? !!prev.preferito : false,
    rating: prev ? (prev.rating||0) : 0,
    foto: App.draftFoto.slice(),
    ingredienti: ings.map(i=>({q:i.q,u:i.u,n:i.n})),
    passaggi: steps
  };

  if(App.currentId){
    const idx=App.recipes.findIndex(x=>x.id===App.currentId);
    App.recipes[idx]=rec;
  } else {
    App.recipes.unshift(rec);
  }
  await App.save();
  App._sessionPhotos=new Set();            // le foto sono ora salvate
  for(const fid of prevFoto){ if(!rec.foto.includes(fid)) await gcPhoto(fid); } // rimuovo le foto tolte
  stopAutosave(); await clearDraft();     // salvataggio riuscito: la bozza non serve più
  toast(App.currentId?"Modifiche salvate":"Ricetta salvata");
  App.open(rec.id);
}

/* Gli ingredienti si sommano solo se nome e unità coincidono; le voci "q.b."
   e le unità diverse restano separate (niente conversioni inventate). */
async function addToSpesa(rid, porzioni){
  const r=App.find(rid); if(!r) return;
  const f = porzioni / r.porzioniBase;
  r.ingredienti.forEach(i=>{
    const q = (i.q==null||i.q==="") ? null : Math.round(i.q*f*100)/100;
    const key = normName(i.n)+"|"+normName(i.u||"");
    const ex = App.spesa.find(s=>s.key===key);
    if(ex){
      if(ex.q!=null && q!=null) ex.q = Math.round((ex.q+q)*100)/100;
      if(!ex.from.includes(r.nome)) ex.from.push(r.nome);
      ex.checked=false;
    } else {
      App.spesa.push({key, n:i.n, u:i.u||"", q, checked:false, from:[r.nome]});
    }
  });
  await App.saveSpesa();
  toast(`"${r.nome}" aggiunta alla lista spesa`);
}

/* somma gli ingredienti di tutte le ricette pianificate (alle loro porzioni base) */
function aggregatePlan(){
  const agg=[], byKey={};
  GIORNI.forEach(([g])=>PASTI.forEach(([p])=>{
    App.plan[g][p].forEach(rid=>{
      const r=App.find(rid); if(!r) return;
      r.ingredienti.forEach(i=>{
        const q=(i.q==null||i.q==="")?null:(parseFloat(i.q)||0);
        const key=normName(i.n)+"|"+normName(i.u||"");
        if(byKey[key]){ const ex=byKey[key]; if(ex.q!=null&&q!=null) ex.q=Math.round((ex.q+q)*100)/100; }
        else { const item={key,n:i.n,u:i.u||"",q}; byKey[key]=item; agg.push(item); }
      });
    });
  }));
  return agg;
}
async function generatePlanSpesa(){
  const prev={}; App.planSpesa.forEach(s=>{ if(s.checked) prev[s.key]=true; }); // conservo le spunte
  App.planSpesa = aggregatePlan().map(s=>({...s, checked:!!prev[s.key]}));
  await App.savePlanSpesa();
  renderPiano();
  toast(App.planSpesa.length? "Lista della spesa aggiornata dai pasti" : "Pianifica qualche pasto per generarla");
}

}
async function planRemove(g,p,rid){
  App.plan[g][p]=(App.plan[g][p]||[]).filter(x=>x!==rid);
  await App.savePlan(); renderPiano();
}
async function planClearDay(g){
  PASTI.forEach(([p])=>App.plan[g][p]=[]);

async function planClearWeek(){
