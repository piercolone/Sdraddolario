name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Importante: Java 17 è l'ambiente ideale per Cordova Android 10+ / Gradle 8

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Installazione Dipendenze Cordova
        run: |
          npm install -g cordova
          npm ci || npm install

      - name: Clean e Build Cordova APK
        run: |
          # Pulisce la piattaforma per evitare conflitti di cache
          npx cordova platform rm android --nosave || true
          npx cordova platform add android
          npx cordova build android --debug
