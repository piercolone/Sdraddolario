name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Componenti SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Installa Cordova
        run: npm install -g cordova
      - name: Aggiungi Android (versione stabile 13)
        run: cordova platform add android@13.0.0
      - name: Forza appcompat 1.6.1
        run: |
          mkdir -p platforms/android/app
          printf "configurations.all {\n    resolutionStrategy {\n        force 'androidx.appcompat:appcompat:1.6.1'\n    }\n}\n" > platforms/android/app/build-extras.gradle
      - name: Build APK
        run: cordova build android
      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ricettario-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
