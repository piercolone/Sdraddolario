name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Installazione Dipendenze Cordova
        run: |
          npm install -g cordova
          npm ci || npm install

      - name: Pulizia e Build Cordova APK
        run: |
          # Rimuove lo spazio UTF-8 NBSP (\xC2\xA0) e il BOM (\xEF\xBB\xBF) da config.xml
          sed -i 's/\xC2\xA0/ /g; s/\xEF\xBB\xBF//g' config.xml
          
          # Pulisce le piattaforme ed esegue la build Android
          rm -rf platforms/
          npx cordova platform add android@14.0.1
          npx cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ricettario-Debug-APK
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
